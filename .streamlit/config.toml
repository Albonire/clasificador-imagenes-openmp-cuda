# Configuración de Streamlit para producción.
# Los ajustes de servidor (puerto/dirección) se fijan vía variables de entorno
# en el Dockerfile para que la plataforma de despliegue pueda sobreescribirlos.

[server]
# Las imágenes de rostro son pequeñas; 10 MB es más que suficiente.
maxUploadSize = 10
# Protección XSRF activa (valor por defecto seguro detrás de un proxy HTTPS).
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
# Paleta "moderna neutra" (ver app_streamlit/ui/theme.py para los tokens
# completos): un acento discreto en vez del rojo/azul institucional.
primaryColor = "#4F46E5"
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F4F4F5"
textColor = "#18181B"
